<!-- LinkedIn Social Card 4: Sprint Results
     Dimensions: 1200×627px | Brand: Agentic SDLC Platform
     Usage: Sprint case study (Week 2, Thu April 3) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; }
      .body { font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#F7FAFC"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="#0A3A66"/>

  <!-- Header -->
  <rect x="0" y="4" width="1200" height="120" fill="#0A3A66"/>
  <text x="80" y="48" class="heading" fill="#D9E2EC" font-size="14" font-weight="600" letter-spacing="3">SPRINT 1 RESULTS</text>
  <text x="80" y="90" class="heading" fill="#FFFFFF" font-size="34" font-weight="700">12 Days. 15 Items. 87% Velocity.</text>

  <!-- KPI cards row 1 -->
  <g transform="translate(60, 150)">
    <!-- Items Completed -->
    <rect x="0" y="0" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
    <text x="125" y="45" class="mono" fill="#0A3A66" font-size="56" font-weight="700" text-anchor="middle">13</text>
    <text x="125" y="68" class="body" fill="#334E68" font-size="12" text-anchor="middle">of 15 items</text>
    <text x="125" y="100" class="heading" fill="#102A43" font-size="16" font-weight="700" text-anchor="middle">Delivered</text>
    <!-- Progress bar -->
    <rect x="30" y="120" width="190" height="8" rx="4" fill="#D9E2EC"/>
    <rect x="30" y="120" width="165" height="8" rx="4" fill="#027A48"/>
    <text x="125" y="145" class="mono" fill="#027A48" font-size="11" text-anchor="middle">87%</text>

    <!-- Tests -->
    <rect x="280" y="0" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
    <text x="405" y="45" class="mono" fill="#1B6B5E" font-size="56" font-weight="700" text-anchor="middle">122</text>
    <text x="405" y="68" class="body" fill="#334E68" font-size="12" text-anchor="middle">automated tests</text>
    <text x="405" y="100" class="heading" fill="#102A43" font-size="16" font-weight="700" text-anchor="middle">Tests Passing</text>
    <!-- Pass indicator -->
    <rect x="310" y="118" width="190" height="26" rx="4" fill="#027A48" opacity="0.1"/>
    <text x="405" y="136" class="mono" fill="#027A48" font-size="13" font-weight="600" text-anchor="middle">0 FAILURES</text>

    <!-- Coverage -->
    <rect x="560" y="0" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
    <text x="685" y="45" class="mono" fill="#E87722" font-size="56" font-weight="700" text-anchor="middle">80%</text>
    <text x="685" y="68" class="body" fill="#334E68" font-size="12" text-anchor="middle">enforced gate</text>
    <text x="685" y="100" class="heading" fill="#102A43" font-size="16" font-weight="700" text-anchor="middle">Code Coverage</text>
    <!-- Gate indicator -->
    <rect x="590" y="118" width="190" height="26" rx="4" fill="#E87722" opacity="0.1"/>
    <text x="685" y="136" class="mono" fill="#E87722" font-size="13" font-weight="600" text-anchor="middle">GATE ENFORCED</text>

    <!-- Sprint Duration -->
    <rect x="840" y="0" width="250" height="160" rx="10" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
    <text x="965" y="45" class="mono" fill="#0A3A66" font-size="56" font-weight="700" text-anchor="middle">12</text>
    <text x="965" y="68" class="body" fill="#334E68" font-size="12" text-anchor="middle">calendar days</text>
    <text x="965" y="100" class="heading" fill="#102A43" font-size="16" font-weight="700" text-anchor="middle">Sprint Duration</text>
    <!-- Timeline -->
    <text x="965" y="138" class="mono" fill="#334E68" font-size="11" text-anchor="middle">Mar 08 → Mar 20</text>
  </g>

  <!-- Deliverables section -->
  <g transform="translate(60, 340)">
    <text x="0" y="20" class="heading" fill="#102A43" font-size="18" font-weight="700">Key Deliverables</text>

    <g transform="translate(0, 40)">
      <!-- Column 1 -->
      <circle cx="12" cy="10" r="6" fill="#027A48"/>
      <text x="28" y="15" class="body" fill="#102A43" font-size="13">Express.js server with health + dashboard APIs</text>

      <circle cx="12" cy="38" r="6" fill="#027A48"/>
      <text x="28" y="43" class="body" fill="#102A43" font-size="13">9-job GitHub Actions CI/CD pipeline</text>

      <circle cx="12" cy="66" r="6" fill="#027A48"/>
      <text x="28" y="71" class="body" fill="#102A43" font-size="13">Questionnaire &amp; Decisions Manager Web UI</text>

      <circle cx="12" cy="94" r="6" fill="#027A48"/>
      <text x="28" y="99" class="body" fill="#102A43" font-size="13">Docker containerization + multi-stage builds</text>

      <!-- Column 2 -->
      <circle cx="552" cy="10" r="6" fill="#027A48"/>
      <text x="568" y="15" class="body" fill="#102A43" font-size="13">Structured logging + runtime metrics</text>

      <circle cx="552" cy="38" r="6" fill="#027A48"/>
      <text x="568" y="43" class="body" fill="#102A43" font-size="13">Security hardening (Gitleaks + Trivy)</text>

      <circle cx="552" cy="66" r="6" fill="#027A48"/>
      <text x="568" y="71" class="body" fill="#102A43" font-size="13">Technical + User documentation</text>

      <circle cx="552" cy="94" r="6" fill="#027A48"/>
      <text x="568" y="99" class="body" fill="#102A43" font-size="13">Accessibility gate (WCAG 2.1 AA)</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="540" width="1200" height="87" fill="#0A3A66"/>
  <text x="80" y="572" class="heading" fill="#FFFFFF" font-size="18" font-weight="700">Strategy → Architecture → UX → Brand → Code. All AI-orchestrated.</text>
  <text x="80" y="600" class="mono" fill="#D9E2EC" font-size="12">github.com/RobertAgterhuis/myAgentic-IT-Project-team-V2 | Open Source</text>

  <!-- Accent bar bottom -->
  <rect x="0" y="623" width="1200" height="4" fill="#E87722"/>
</svg>
