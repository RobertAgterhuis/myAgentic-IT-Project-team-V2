# docker-compose.webapp.yml — End-user: webapp only
# Usage: docker compose -f infra/docker-compose.webapp.yml up --build
# Provides: Command Center web UI on http://127.0.0.1:3000

services:
  command-center:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: myagentic-command-center
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ../BusinessDocs:/app/BusinessDocs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
