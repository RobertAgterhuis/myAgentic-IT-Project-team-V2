# Refactoring Workflow
# Workflow for planned technical debt reduction and code improvement.

id: refactoring
name: Refactoring
description: Planned technical debt reduction — restructure code without changing external behavior.
version: "1.0.0"

triggers:
  - event: tech-debt-prioritized
  - command: "REFACTOR"

stages:
  - stage: ARCHITECTURE
    label: Impact Analysis
    agents:
      - software-architect
      - senior-developer
    gates:
      - G-ARCH-01
    artifacts:
      - refactoring-plan
      - impact-analysis

  - stage: PLANNING
    agents:
      - product-manager
    gates:
      - G-PLAN-01
    artifacts:
      - refactoring-tasks

  - stage: IMPLEMENTATION
    agents:
      - implementation-agent
    gates:
      - G-IMPL-01
      - G-IMPL-02
    artifacts:
      - refactored-code
      - refactoring-pr

  - stage: TESTING
    agents:
      - test-agent
    gates:
      - G-TEST-01
      - G-TEST-02
      - G-TEST-03
    artifacts:
      - full-regression-report
      - performance-comparison

  - stage: RELEASE
    agents:
      - pr-review-agent
    gates:
      - G-REL-01
      - G-REL-02
    artifacts:
      - refactoring-summary

validation:
  behavior_change_check: true
  performance_regression_check: true
