# Orchestrator Flow Definition (FEAT-05-A / AC-1)
# Declarative specification of states, transitions, and command modes.
# Parsed by flow-loader.ts using a maintained YAML parser.

manifest_version: "2.0"
pack_id: core-runtime
pack_name: Core Runtime Pack
version: 2.0.0

# ─── State Definitions ──────────────────────────────────────
states:
  - IDLE
  - ONBOARDING
  - PHASE_1
  - CRITIC_1
  - PHASE_2
  - CRITIC_2
  - PHASE_3
  - CRITIC_3
  - PHASE_4
  - CRITIC_4
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED
  - ERROR

# ─── Full Flow (CREATE cycle) ───────────────────────────────
# Ordered transition chain: each state transitions to the next.
full_flow:
  - IDLE
  - ONBOARDING
  - PHASE_1
  - CRITIC_1
  - PHASE_2
  - CRITIC_2
  - PHASE_3
  - CRITIC_3
  - PHASE_4
  - CRITIC_4
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED

# ─── Structural States ──────────────────────────────────────
# Always included regardless of selected phases.
structural_states:
  - IDLE
  - ONBOARDING
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED

# ─── Command Mode Configurations ────────────────────────────
modes:
  CREATE:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: Full CREATE cycle

  AUDIT:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: Full AUDIT cycle

  CREATE_BUSINESS:
    phases:
      - PHASE_1
    label: Business-only CREATE

  CREATE_TECH:
    phases:
      - PHASE_2
    label: Tech-only CREATE

  CREATE_UX:
    phases:
      - PHASE_3
    label: UX-only CREATE

  CREATE_MARKETING:
    phases:
      - PHASE_4
    label: Marketing-only CREATE

  FEATURE:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: FEATURE full cycle

  SCOPE_CHANGE:
    phases: []
    label: Scope change re-analysis

  HOTFIX:
    phases: []
    label: Emergency HOTFIX

  SDLC_ONLY:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: SDLC Only (default execution mode)

  AGENCY_ONLY:
    phases: []
    label: Agency Only (pure agency team execution)

  HYBRID:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: Hybrid SDLC + Agency injection

# ─── Pack Commands Metadata ────────────────────────────────
commands:
  - id: CREATE
    label: CREATE
    description: Full CREATE cycle
  - id: CREATE BUSINESS
    label: CREATE BUSINESS
    description: Business-only CREATE cycle
  - id: CREATE TECH
    label: CREATE TECH
    description: Tech-only CREATE cycle
  - id: CREATE UX
    label: CREATE UX
    description: UX-only CREATE cycle
  - id: CREATE MARKETING
    label: CREATE MARKETING
    description: Marketing-only CREATE cycle
  - id: CREATE SYNTHESIS
    label: CREATE SYNTHESIS
    description: CREATE synthesis mode
  - id: AUDIT
    label: AUDIT
    description: Full AUDIT cycle
  - id: AUDIT BUSINESS
    label: AUDIT BUSINESS
    description: Business-only AUDIT cycle
  - id: AUDIT TECH
    label: AUDIT TECH
    description: Tech-only AUDIT cycle
  - id: AUDIT UX
    label: AUDIT UX
    description: UX-only AUDIT cycle
  - id: AUDIT MARKETING
    label: AUDIT MARKETING
    description: Marketing-only AUDIT cycle
  - id: AUDIT SYNTHESIS
    label: AUDIT SYNTHESIS
    description: AUDIT synthesis mode
  - id: REEVALUATE
    label: REEVALUATE
    description: Reevaluate a scoped change
  - id: FEATURE
    label: FEATURE
    description: Deliver a feature increment
  - id: SCOPE CHANGE
    label: SCOPE CHANGE
    description: Trigger scope-change analysis
  - id: HOTFIX
    label: HOTFIX
    description: Emergency hotfix path
  - id: REFRESH ONBOARDING
    label: REFRESH ONBOARDING
    description: Refresh onboarding context
  - id: CONTINUE
    label: CONTINUE
    description: Continue current session flow
  - id: AGENCY ONLY
    label: AGENCY ONLY
    description: Pure agency team execution without SDLC phases
  - id: HYBRID
    label: HYBRID
    description: Hybrid SDLC + agency specialist injection

# ─── Pack Stages Metadata ──────────────────────────────────
stages:
  - id: IDLE
    label: Idle
    order: 0
  - id: ONBOARDING
    label: Onboarding
    order: 1
  - id: PHASE_1
    label: Phase 1
    order: 2
  - id: CRITIC_1
    label: Critic 1
    order: 3
  - id: PHASE_2
    label: Phase 2
    order: 4
  - id: CRITIC_2
    label: Critic 2
    order: 5
  - id: PHASE_3
    label: Phase 3
    order: 6
  - id: CRITIC_3
    label: Critic 3
    order: 7
  - id: PHASE_4
    label: Phase 4
    order: 8
  - id: CRITIC_4
    label: Critic 4
    order: 9
  - id: SYNTHESIS
    label: Synthesis
    order: 10
  - id: SPRINT_GATE
    label: Sprint Gate
    order: 11
  - id: PHASE_5_EXECUTING
    label: Phase 5 Executing
    order: 12
  - id: COMPLETED
    label: Completed
    order: 13

# ─── Events ─────────────────────────────────────────────────
events:
  - transition
  - error
  - gate_passed
  - gate_failed
  - crash_recovery

# ─── Gates ──────────────────────────────────────────────────
gates:
  - id: gate.critic-risk-1
    after: PHASE_1
    before: PHASE_2
    type: CRITIC_RISK
    conditions:
      - All PHASE_1 agent handoff checklists complete
      - Critic agent validation passed
      - Risk agent assessment completed
      - No unresolved BLOCKING items

  - id: gate.critic-risk-2
    after: PHASE_2
    before: PHASE_3
    type: CRITIC_RISK
    conditions:
      - All PHASE_2 agent handoff checklists complete
      - Critic agent validation passed
      - Risk agent assessment completed
      - No unresolved BLOCKING items

  - id: gate.critic-risk-3
    after: PHASE_3
    before: PHASE_4
    type: CRITIC_RISK
    conditions:
      - All PHASE_3 agent handoff checklists complete
      - Critic agent validation passed
      - Risk agent assessment completed
      - No unresolved BLOCKING items

  - id: gate.critic-risk-4
    after: PHASE_4
    before: SYNTHESIS
    type: CRITIC_RISK
    conditions:
      - All PHASE_4 agent handoff checklists complete
      - Critic agent validation passed
      - Risk agent assessment completed
      - No unresolved BLOCKING items

  - id: gate.synthesis-approval
    after: SYNTHESIS
    before: SPRINT_GATE
    type: SYNTHESIS_APPROVAL
    conditions:
      - All 6 synthesis documents approved
      - BLOCKING items linked to sprint plan
      - Cross-team blocker matrix complete

  - id: gate.sprint-gate
    after: SPRINT_GATE
    before: PHASE_5_EXECUTING
    type: SPRINT_GATE
    conditions:
      - Definition of Ready check passed
      - Lessons-learned injection completed
      - Sprint backlog approved

