# Orchestrator Flow Definition (FEAT-05-A / AC-1)
# Declarative specification of states, transitions, and command modes.
# Parsed by flow-loader.ts using a maintained YAML parser.

# ─── State Definitions ──────────────────────────────────────
states:
  - IDLE
  - ONBOARDING
  - PHASE_1
  - CRITIC_1
  - PHASE_2
  - CRITIC_2
  - PHASE_3
  - CRITIC_3
  - PHASE_4
  - CRITIC_4
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED
  - ERROR

# ─── Full Flow (CREATE cycle) ───────────────────────────────
# Ordered transition chain: each state transitions to the next.
full_flow:
  - IDLE
  - ONBOARDING
  - PHASE_1
  - CRITIC_1
  - PHASE_2
  - CRITIC_2
  - PHASE_3
  - CRITIC_3
  - PHASE_4
  - CRITIC_4
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED

# ─── Structural States ──────────────────────────────────────
# Always included regardless of selected phases.
structural_states:
  - IDLE
  - ONBOARDING
  - SYNTHESIS
  - SPRINT_GATE
  - PHASE_5_EXECUTING
  - COMPLETED

# ─── Command Mode Configurations ────────────────────────────
modes:
  CREATE:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: Full CREATE cycle

  AUDIT:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: Full AUDIT cycle

  CREATE_BUSINESS:
    phases:
      - PHASE_1
    label: Business-only CREATE

  CREATE_TECH:
    phases:
      - PHASE_2
    label: Tech-only CREATE

  CREATE_UX:
    phases:
      - PHASE_3
    label: UX-only CREATE

  CREATE_MARKETING:
    phases:
      - PHASE_4
    label: Marketing-only CREATE

  FEATURE:
    phases:
      - PHASE_1
      - PHASE_2
      - PHASE_3
      - PHASE_4
    label: FEATURE full cycle

  SCOPE_CHANGE:
    phases: []
    label: Scope change re-analysis

  HOTFIX:
    phases: []
    label: Emergency HOTFIX

# ─── Events ─────────────────────────────────────────────────
events:
  - transition
  - error
  - gate_passed
  - gate_failed
  - crash_recovery
