name: Staging CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

concurrency:
  group: staging-cd
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging + Smoke Validation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout workflow_run SHA
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start staging runtime
        run: |
          nohup npx tsx src/webapp/server.ts > staging-server.log 2>&1 &

      - name: Wait for staging health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/health/live > /dev/null; then
              echo "Staging runtime is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Staging runtime did not become healthy in time"
          exit 1

      - name: Run smoke validation suite
        run: npm run test:smoke
        env:
          CI: true

      - name: Run post-deploy health gates
        run: node scripts/post-deploy-check.mjs --profile production-single-node --base-url http://127.0.0.1:3000

      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: staging-cd-logs
          path: |
            staging-server.log
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
