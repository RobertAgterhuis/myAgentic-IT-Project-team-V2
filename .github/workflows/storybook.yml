name: Storybook CI

on:
  pull_request:
    paths:
      - "src/webapp/ui/**"
      - "src/webapp/brand/design-tokens.json"
      - "scripts/build-tokens.mjs"
  push:
    branches: [main]
    paths:
      - "src/webapp/ui/**"
      - "src/webapp/brand/design-tokens.json"
      - "scripts/build-tokens.mjs"

permissions:
  contents: read

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webapp/ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/webapp/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: node scripts/build-tokens.mjs
        working-directory: .

      - name: Build Storybook
        run: npx storybook build -o storybook-static

      - name: Upload Storybook artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: src/webapp/ui/storybook-static

  deploy-storybook:
    if: github.ref == 'refs/heads/main'
    needs: build-storybook
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
