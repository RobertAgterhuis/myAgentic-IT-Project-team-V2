# Consolidated CI/CD Pipeline
# Merged from ci.yml (security-hardened) + ci-pipeline.yml (Sprint 1)
# SHA-pinned actions for supply-chain security
# Node 22 runtime

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOCKER_BUILDKIT: 1

jobs:
  # ──────────────────────────────────────────────
  # Gate 1: Code Quality
  # ──────────────────────────────────────────────

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/webapp/ui

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: TypeScript strict type check
        run: npm run typecheck

  # ──────────────────────────────────────────────
  # Gate 2: Tests
  # ──────────────────────────────────────────────

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            src/webapp/ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/webapp/ui

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Install Playwright browser for frontend coverage
        run: npx playwright install chromium
        working-directory: src/webapp/ui

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage --prefix src/webapp/ui
        env:
          VITEST_ONLY_PROJECT: unit

      - name: Enforce coverage thresholds
        run: npm run test:coverage:gate
        env:
          COVERAGE_MIN_STATEMENTS: 70
          COVERAGE_MIN_BRANCHES: 55
          COVERAGE_MIN_FUNCTIONS: 70
          COVERAGE_MIN_LINES: 70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          retention-days: 30

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage-report
          path: |
            src/webapp/ui/coverage/coverage-final.json
            src/webapp/ui/coverage/coverage-summary.json
            src/webapp/ui/coverage/index.html
          if-no-files-found: warn
          retention-days: 30

  regression-gates:
    name: Prompt Snapshot + Perf Gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify prompt template snapshots
        run: npm run test:prompt-snapshots

      - name: Run performance regression gate
        run: npm run test:perf-gate

      - name: Run autonomy benchmark suite
        run: npm run test:autonomy-benchmark

      - name: Run autonomy readiness gate
        run: npm run test:autonomy-readiness-gate

  mutation-gate:
    name: Mutation Testing Gate (main)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing gate
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation-report.json
          if-no-files-found: warn
          retention-days: 14

  runtime-profile-validation:
    name: Runtime Profile Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime profile contract
        run: npx vitest run tests/unit/runtime-profiles.test.js tests/unit/server-startup-validation.test.js tests/unit/server-storage-enforcement.test.js

  chat-quality-gate:
    name: Chat Quality & Latency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run M-UX-2b chat quality regression gate
        run: npm run test:chat-quality-gate

  translation-validation:
    name: Translation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate translations (en-US, fr-FR, de-DE)
        run: npx vitest run tests/unit/translation-validation.test.js

  integration-test:
    name: Integration Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true

  smoke-test:
    name: Smoke Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true

  a11y:
    name: Accessibility (axe + keyboard)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/webapp/ui

      - name: Build web app for Playwright
        run: npm run build

      - name: Bundle budget gate (P1-UI-E3-I1)
        run: node scripts/check-bundle-budget.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility gate
        run: npm run test:a11y -- --reporter=line
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never

  # ──────────────────────────────────────────────
  # Gate 3: Security
  # ──────────────────────────────────────────────

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          docker run --rm \
            -v "$PWD:/pwd" \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd --only-verified --fail --no-update

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep
        run: semgrep scan --config p/javascript --config p/nodejs --config p/security-audit --error

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@38b3b7bf288d49ccf58644769dc7a6afdccd05eb # v3
        with:
          sarif_file: "trivy-results.sarif"

  # ──────────────────────────────────────────────
  # Gate 4: Build & Docker
  # ──────────────────────────────────────────────

  build:
    name: Build & Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, regression-gates, runtime-profile-validation, a11y]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/webapp/ui

      - name: Build application
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          platforms: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Docker image for scanning
        run: docker build -f infra/Dockerfile -t app:ci .

      - name: Run Trivy on container image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          scan-type: image
          image-ref: app:ci
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ──────────────────────────────────────────────
  # Gate 5: Accessibility (main only)
  # ──────────────────────────────────────────────

  accessibility-gate:
    name: Accessibility Gate
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: npx tsx src/webapp/server.ts &
        env:
          NODE_ENV: test

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Run axe-core WCAG audit
        run: npx @axe-core/cli http://127.0.0.1:3000 --tags wcag2a,wcag2aa --exit

      - name: Run Lighthouse accessibility audit
        run: |
          npx lighthouse http://127.0.0.1:3000 \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=./a11y-report.json

      - name: Verify Lighthouse score >= 90
        run: |
          SCORE=$(node -e "const r=require('./a11y-report.json');console.log(Math.floor(r.categories.accessibility.score*100))")
          echo "Accessibility score: $SCORE"
          if [ "$SCORE" -lt "90" ]; then
            echo "::error::Accessibility score $SCORE is below 90 threshold"
            exit 1
          else
            echo "Accessibility score $SCORE meets threshold"
          fi

      - name: Upload accessibility report
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        if: always()
        with:
          name: accessibility-report
          path: a11y-report.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # Gate 6: Autonomous Lane Smoke Test (Epic E-B2)
  # ──────────────────────────────────────────────

  autonomous-lane-smoke:
    name: Autonomous Lane Smoke Path
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' || contains(github.head_ref, 'e-b2') || contains(github.head_ref, 'autonomous')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create autonomous lane test trace directory
        run: mkdir -p tests/load/autonomous-lane-traces

      - name: Run autonomous lane smoke test
        run: npm run test:autonomous-lane -- --reporter=json --reporter=default
        env:
          CI: true
          AUTONOMOUS_LANE_MODE: smoke
          ARTIFACT_TRACE_ENABLED: true

      - name: Publish autonomous lane artifacts
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        if: always()
        with:
          name: autonomous-lane-traces
          path: tests/load/autonomous-lane-traces/
          retention-days: 90

      - name: Generate failure classification report
        if: failure()
        run: |
          node scripts/classify-lane-failures.js \
            --input tests/load/autonomous-lane-traces/*.json \
            --output tests/load/autonomous-lane-traces/failure-classification.json

      - name: Upload failure classification report
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        if: failure()
        with:
          name: autonomous-lane-failure-report
          path: tests/load/autonomous-lane-traces/failure-classification.json
          retention-days: 90

      - name: Comment PR with lane results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const traceDir = 'tests/load/autonomous-lane-traces';

            let summary = '## 🤖 Autonomous Lane Smoke Test Results\n\n';

            if (fs.existsSync(traceDir)) {
              const files = fs.readdirSync(traceDir).filter(f => f.endsWith('.json'));
              if (files.length > 0) {
                summary += `✅ Produced ${files.length} trace artifact(s)\n\n`;
                summary += '**Artifacts:**\n';
                files.forEach(f => {
                  summary += `- ${f}\n`;
                });
              } else {
                summary += '⚠️ No trace artifacts generated\n';
              }
            } else {
              summary += '❌ No trace directory found\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
