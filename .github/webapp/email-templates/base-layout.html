<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-rspace: 0pt; mso-table-lspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; background-color: #f4f4f7; }

    /* Typography — Inter with system fallbacks */
    .body-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      .email-body { background-color: #1a202c !important; }
      .email-content { background-color: #2d3748 !important; }
      .email-content h1, .email-content h2, .email-content p, .email-content li { color: #e2e8f0 !important; }
      .email-header { background-color: #2d3748 !important; }
      .email-footer { background-color: #1a202c !important; }
      .email-footer p { color: #a0aec0 !important; }
    }

    /* Responsive */
    @media only screen and (max-width: 620px) {
      .email-content { width: 100% !important; padding: 24px 16px !important; }
      .email-header { padding: 20px 16px !important; }
      .email-footer { padding: 20px 16px !important; }
      .cta-button { display: block !important; width: 100% !important; text-align: center !important; }
    }
  </style>
</head>
<body class="body-text" style="margin:0; padding:0; background-color:#f4f4f7;">
  <!-- Preheader text (hidden) -->
  <div style="display:none; font-size:1px; color:#f4f4f7; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
    {{PREHEADER}}
  </div>

  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f4f4f7;" class="email-body">
    <tr>
      <td align="center" style="padding: 24px 0;">

        <!-- Email container (600px max) -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px; width:100%;">

          <!-- Header -->
          <tr>
            <td class="email-header" style="background-color:#fafafa; padding:28px 32px; border-radius:8px 8px 0 0; border-bottom:3px solid #2563eb;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:20px; font-weight:700; color:#1a365d;">
                    Agentic SDLC Platform
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="email-content" style="background-color:#ffffff; padding:40px 32px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.6; color:#2d3748;">
              {{CONTENT}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="email-footer" style="background-color:#f7fafc; padding:24px 32px; border-radius:0 0 8px 8px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#718096; text-align:center;">
                    <p style="margin:0 0 8px;">Agentic SDLC Platform &bull; Built with 30+ AI agents</p>
                    <p style="margin:0 0 8px;">
                      <a href="https://github.com/RobertAgterhuis/myAgentic-IT-Project-team-V2" style="color:#2563eb; text-decoration:underline;">GitHub</a>
                    </p>
                    <p style="margin:0;">
                      <a href="{{UNSUBSCRIBE_URL}}" style="color:#718096; text-decoration:underline;">Unsubscribe</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
