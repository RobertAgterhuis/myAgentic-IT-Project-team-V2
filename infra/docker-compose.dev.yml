# docker-compose.dev.yml — Full-stack developer: all services
# Usage:
#   1. cp .env.example .env          # set MATOMO_DB_PASSWORD, MATOMO_DB_ROOT_PASSWORD
#   2. cp .env.weblate.example .env.weblate  # set WEBLATE_ADMIN_PASSWORD, WEBLATE_DB_PASSWORD
#   3. docker compose -f infra/docker-compose.dev.yml up --build
#
# Services:
#   command-center  → http://127.0.0.1:3000  (webapp)
#   storybook       → http://127.0.0.1:6006  (design system)
#   matomo-web      → http://127.0.0.1:8080  (analytics)
#   weblate         → http://127.0.0.1:8081  (translations)

services:
  # ── Webapp ─────────────────────────────────────────────────
  command-center:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: myagentic-command-center
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ../BusinessDocs:/app/BusinessDocs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - dev

  # ── Storybook ──────────────────────────────────────────────
  storybook:
    build:
      context: ..
      dockerfile: infra/Dockerfile.storybook
    container_name: myagentic-storybook
    ports:
      - "127.0.0.1:6006:80"
    restart: unless-stopped
    networks:
      - dev

  # ── Matomo (Analytics) ─────────────────────────────────────
  matomo:
    image: matomo:5-fpm-alpine
    restart: unless-stopped
    volumes:
      - matomo-data:/var/www/html
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_DBNAME=matomo
      - MATOMO_DATABASE_USERNAME=matomo
      - MATOMO_DATABASE_PASSWORD=${MATOMO_DB_PASSWORD}
    depends_on:
      matomo-db:
        condition: service_healthy
    networks:
      - dev

  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    volumes:
      - matomo-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MATOMO_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo
      - MYSQL_PASSWORD=${MATOMO_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

  matomo-web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MATOMO_PORT:-8080}:80"
    volumes:
      - matomo-data:/var/www/html:ro
      - ./matomo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - matomo
    networks:
      - dev

  # ── Weblate (Translations) ────────────────────────────────
  weblate:
    image: weblate/weblate:5.4
    restart: unless-stopped
    depends_on:
      weblate-db:
        condition: service_healthy
      weblate-cache:
        condition: service_healthy
    environment:
      WEBLATE_SITE_DOMAIN: "localhost"
      WEBLATE_SITE_TITLE: "Agentic SDLC Translations"
      WEBLATE_ADMIN_EMAIL: "${WEBLATE_ADMIN_EMAIL:-admin@localhost}"
      WEBLATE_ADMIN_PASSWORD: "${WEBLATE_ADMIN_PASSWORD}"
      WEBLATE_ADMIN_NAME: "Admin"
      WEBLATE_SERVER_EMAIL: "noreply@localhost"
      WEBLATE_DEFAULT_FROM_EMAIL: "noreply@localhost"
      WEBLATE_ALLOWED_HOSTS: "*"
      WEBLATE_REGISTRATION_OPEN: "0"
      POSTGRES_PASSWORD: "${WEBLATE_DB_PASSWORD}"
      POSTGRES_USER: "weblate"
      POSTGRES_DATABASE: "weblate"
      POSTGRES_HOST: "weblate-db"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "weblate-cache"
      REDIS_PORT: "6379"
      WEBLATE_ENABLE_HTTPS: "0"
      WEBLATE_IP_PROXY_HEADER: ""
      WEBLATE_REQUIRE_LOGIN: "1"
    volumes:
      - weblate-data:/app/data
    ports:
      - "127.0.0.1:${WEBLATE_PORT:-8081}:8080"
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  weblate-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "weblate"
      POSTGRES_PASSWORD: "${WEBLATE_DB_PASSWORD}"
      POSTGRES_DB: "weblate"
    volumes:
      - weblate-db-data:/var/lib/postgresql/data
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  weblate-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - weblate-cache-data:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matomo-data:
  matomo-db-data:
  weblate-data:
  weblate-db-data:
  weblate-cache-data:

networks:
  dev:
    driver: bridge
