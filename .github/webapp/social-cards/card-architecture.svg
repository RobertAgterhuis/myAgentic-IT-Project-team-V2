<!-- LinkedIn Social Card 3: CI/CD Architecture
     Dimensions: 1200×627px | Brand: Agentic SDLC Platform
     Usage: CI/CD showcase post (Week 1, Fri March 28) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600&amp;display=swap');
      .heading { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; }
      .body { font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#102A43"/>

  <!-- Grid overlay -->
  <g opacity="0.04">
    <rect x="0" y="0" width="1200" height="627" fill="url(#grid)"/>
  </g>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#FFFFFF" stroke-width="0.3"/>
    </pattern>
  </defs>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="#E87722"/>

  <!-- Header -->
  <text x="80" y="55" class="heading" fill="#D9E2EC" font-size="14" font-weight="600" letter-spacing="3">AGENTIC SDLC PLATFORM</text>
  <text x="80" y="100" class="heading" fill="#FFFFFF" font-size="36" font-weight="700">8 Jobs. 0 Secrets Exposed.</text>
  <text x="80" y="145" class="heading" fill="#E87722" font-size="36" font-weight="700">80% Coverage Gate.</text>

  <!-- Pipeline visualization -->
  <g transform="translate(80, 180)">
    <!-- Row 1: Parallel jobs -->
    <rect x="0" y="0" width="200" height="70" rx="6" fill="#1B6B5E"/>
    <text x="100" y="28" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 1</text>
    <text x="100" y="50" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Lint + Format</text>

    <rect x="230" y="0" width="200" height="70" rx="6" fill="#1B6B5E"/>
    <text x="330" y="28" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 2</text>
    <text x="330" y="50" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Test + Coverage</text>

    <rect x="460" y="0" width="200" height="70" rx="6" fill="#1B6B5E"/>
    <text x="560" y="28" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 3</text>
    <text x="560" y="50" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Security Scan</text>

    <rect x="690" y="0" width="200" height="70" rx="6" fill="#1B6B5E"/>
    <text x="790" y="28" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 4</text>
    <text x="790" y="50" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Build + Docker</text>

    <!-- Connector line -->
    <line x1="500" y1="78" x2="500" y2="110" stroke="#E87722" stroke-width="2"/>
    <polygon points="495,108 505,108 500,116" fill="#E87722"/>

    <!-- Row 2: Sequential jobs -->
    <rect x="115" y="120" width="200" height="70" rx="6" fill="#0A3A66"/>
    <text x="215" y="148" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 5</text>
    <text x="215" y="170" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Integration Tests</text>

    <text x="335" y="160" class="body" fill="#D9E2EC" font-size="18">→</text>

    <rect x="365" y="120" width="200" height="70" rx="6" fill="#0A3A66"/>
    <text x="465" y="148" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 6</text>
    <text x="465" y="170" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Smoke Tests</text>

    <text x="585" y="160" class="body" fill="#D9E2EC" font-size="18">→</text>

    <rect x="615" y="120" width="200" height="70" rx="6" fill="#0A3A66"/>
    <text x="715" y="148" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 7</text>
    <text x="715" y="170" class="body" fill="#FFFFFF" font-size="15" font-weight="500" text-anchor="middle">Staging Deploy</text>

    <!-- Connector line -->
    <line x1="500" y1="198" x2="500" y2="230" stroke="#E87722" stroke-width="2"/>
    <polygon points="495,228 505,228 500,236" fill="#E87722"/>

    <!-- Row 3: Final job -->
    <rect x="325" y="240" width="280" height="70" rx="6" fill="#E87722"/>
    <text x="465" y="268" class="mono" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">JOB 8</text>
    <text x="465" y="290" class="heading" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Accessibility Gate</text>
  </g>

  <!-- Stats ribbon -->
  <rect x="0" y="510" width="1200" height="2" fill="#E87722" opacity="0.3"/>
  <g transform="translate(0, 525)">
    <text x="160" y="18" class="mono" fill="#E87722" font-size="28" font-weight="700" text-anchor="middle">139</text>
    <text x="160" y="40" class="body" fill="#D9E2EC" font-size="12" text-anchor="middle">Tests Passing</text>

    <text x="400" y="18" class="mono" fill="#E87722" font-size="28" font-weight="700" text-anchor="middle">80%</text>
    <text x="400" y="40" class="body" fill="#D9E2EC" font-size="12" text-anchor="middle">Coverage Gate</text>

    <text x="640" y="18" class="mono" fill="#E87722" font-size="28" font-weight="700" text-anchor="middle">8</text>
    <text x="640" y="40" class="body" fill="#D9E2EC" font-size="12" text-anchor="middle">CI/CD Jobs</text>

    <text x="880" y="18" class="mono" fill="#E87722" font-size="28" font-weight="700" text-anchor="middle">0</text>
    <text x="880" y="40" class="body" fill="#D9E2EC" font-size="12" text-anchor="middle">Secrets Exposed</text>

    <text x="1080" y="18" class="mono" fill="#1B6B5E" font-size="28" font-weight="700" text-anchor="middle">WCAG</text>
    <text x="1080" y="40" class="body" fill="#D9E2EC" font-size="12" text-anchor="middle">AA Compliant</text>
  </g>

  <!-- Bottom info -->
  <rect x="0" y="577" width="1200" height="50" fill="#0A3A66"/>
  <text x="80" y="607" class="mono" fill="#D9E2EC" font-size="12">Gitleaks · Trivy · axe-core · Lighthouse ≥90% · Jest · GitHub Actions</text>

  <!-- Accent bar bottom -->
  <rect x="0" y="623" width="1200" height="4" fill="#E87722"/>
</svg>
