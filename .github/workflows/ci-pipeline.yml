# CI/CD Pipeline - Sprint 1 Item SP-11-611
# Purpose: Automated build, test, lint, and security scanning for all PRs and commits to main
# Owner: DevOps Engineer + Senior Developer
# Created: 2026-03-11 (Sprint 1 Day 1)

name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "20.x"
  DOCKER_BUILDKIT: 1

jobs:
  # Job 1: Lint and Code Quality
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting (Prettier)
        run: npm run format:check
        continue-on-error: false

  # Job 2: Unit Tests with Coverage
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Codecov upload disabled — coverage thresholds are enforced natively by
      # Vitest (vitest.config.mjs, 80 % global). The external codecov/patch
      # check added friction without extra value.  Re-enable if granular
      # per-file patch-coverage reporting is needed in the future.
      #
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./coverage/coverage-final.json
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

      # Coverage thresholds are enforced by Vitest in ci.yml
      # Root Jest tests cover documentation/landing/integration — no source code coverage expected

  # Job 3: Security Scanning (Vulnerability Detection)
  # Note: Secret scanning is handled by TruffleHog in ci.yml
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # Job 4: Build & Docker Image
  build:
    name: Build & Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

  # Job 5: Integration Tests (pending SP-11-612 completion)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: false # Disabled until SP-11-612 (Test Strategy) is complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true

  # Job 6: Smoke Tests (pending SP-11-613 completion)
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: false # Disabled until SP-11-613 (Smoke Suite) is complete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true

  # Job 7: Translation Validation (S1-1 / SP-2-CI7)
  # Ensures all locale files are complete, consistent, and well-formed.
  translation-validation:
    name: Translation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run translation validation tests
        run: npx jest tests/unit/translation-validation.test.js --passWithNoTests --verbose

  # Job 8: Accessibility Gate (S1-2 / SP-2-CI8)
  # WCAG 2.1 AA enforcement via axe-core + Lighthouse
  # Runs on main pushes and PRs to main
  # When smoke-test is enabled, change needs to [smoke-test]
  accessibility-gate:
    name: Accessibility Gate
    runs-on: ubuntu-latest
    needs: [build]
    if: false # Disabled until server runtime environment is configured for CI (needs SESSION_SECRET, etc.)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install webapp dependencies
        run: npm ci --omit=dev

      - name: Start application
        run: npx tsx src/webapp/server.ts &

      - name: Wait for application
        run: npx wait-on http://127.0.0.1:3000 --timeout 30000

      - name: Run axe-core WCAG audit
        run: npx @axe-core/cli http://127.0.0.1:3000 --tags wcag2a,wcag2aa --exit

      - name: Run Lighthouse accessibility audit
        run: |
          npx lighthouse http://127.0.0.1:3000 \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=./a11y-report.json

      - name: Verify Lighthouse score > 90
        run: |
          SCORE=$(node -e "const r=require('./a11y-report.json');console.log(Math.floor(r.categories.accessibility.score*100))")
          echo "Accessibility score: $SCORE"
          if [ "$SCORE" -lt "90" ]; then
            echo "❌ Accessibility score $SCORE is below 90 threshold"
            exit 1
          else
            echo "✅ Accessibility score $SCORE meets threshold"
          fi

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: a11y-report.json
          retention-days: 30

  # Status Badge Update
  status:
    name: Update Status Badge
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, translation-validation]
    if: always()

    steps:
      - name: Generate build status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "BUILD_STATUS=passing" >> $GITHUB_ENV
            echo "BUILD_COLOR=brightgreen" >> $GITHUB_ENV
          else
            echo "BUILD_STATUS=failing" >> $GITHUB_ENV
            echo "BUILD_COLOR=red" >> $GITHUB_ENV
          fi

      - name: Create status badge
        run: |
          echo "[![CI Pipeline](https://img.shields.io/badge/build-${{ env.BUILD_STATUS }}-${{ env.BUILD_COLOR }})](https://github.com/${{ github.repository }}/actions)"
