name: Storybook CI

on:
  pull_request:
    paths:
      - "src/webapp/ui/**"
      - "src/webapp/brand/design-tokens.json"
      - "scripts/build-tokens.mjs"
  push:
    branches: [main]
    paths:
      - "src/webapp/ui/**"
      - "src/webapp/brand/design-tokens.json"
      - "scripts/build-tokens.mjs"

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webapp/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/webapp/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: node scripts/build-tokens.mjs
        working-directory: .

      - name: Build Storybook
        run: npx storybook build -o storybook-static

      - name: Upload Storybook artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/webapp/ui/storybook-static

  deploy-storybook:
    if: github.ref == 'refs/heads/main'
    needs: build-storybook
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
